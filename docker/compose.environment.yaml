name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  wordpress:
    build:
      context: ..
      dockerfile: .devcontainer/shared/docker/Dockerfile
      args:
        WORDPRESS_IMAGE_TAG: ${WORDPRESS_IMAGE_TAG:?WORDPRESS_IMAGE_TAG is required}
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
        LOCALE: ${LOCALE:-ja_JP.UTF-8}
        TZ: ${TZ:-Asia/Tokyo}
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      LANG: ${LOCALE:-ja_JP.UTF-8}
      WORDPRESS_SITE_URL: ${WORDPRESS_SITE_URL:?WORDPRESS_SITE_URL is required}

      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}

      CODEX_HOME: /var/www/.codex
      GH_CONFIG_DIR: /var/www/.config/gh
    ports:
      - "127.0.0.1:${WORDPRESS_PORT:?WORDPRESS_PORT is required}:80"
    volumes:
      - type: volume
        source: wordpress_data
        target: /var/www/html

      - type: bind
        source: ../app
        target: /var/www/html/wp-content/plugins/yamabiko-blocks
        bind:
          create_host_path: false

      - type: bind
        source: ..
        target: /workspaces/yamabiko-blocks
        bind:
          create_host_path: false

      - type: bind
        source: ../.devcontainer/shared/php/xdebug.ini
        target: /usr/local/etc/php/conf.d/99-xdebug.ini
        read_only: true
        bind:
          create_host_path: false

      - type: volume
        source: codex_data
        target: /var/www/.codex

      - type: volume
        source: gh_config
        target: /var/www/.config/gh

      - type: bind
        source: ../.devcontainer/shared/php/php.ini
        target: /usr/local/etc/php/conf.d/zz-development.ini
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MARIADB_USER: ${WORDPRESS_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-wordpress-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  wordpress_data:
  db_data:
  codex_data:
  gh_config:
