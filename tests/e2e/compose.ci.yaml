name: yamabiko-table-reorder-e2e-ci

services:
  db:
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress-root
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  wordpress:
    image: ${E2E_WORDPRESS_IMAGE:-wordpress:7.1.0-php8.3-apache}
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'development' );
        define( 'WP_AUTO_UPDATE_CORE', false );
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - wordpress_data:/var/www/html
      - ../..:/var/www/html/wp-content/plugins/yamabiko-table-reorder:ro
    depends_on:
      db:
        condition: service_healthy

  cli:
    image: wordpress:cli-2.12.0-php8.3
    user: '33:33'
    environment:
      HOME: /tmp
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ../..:/var/www/html/wp-content/plugins/yamabiko-table-reorder:ro
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started

volumes:
  wordpress_data:
