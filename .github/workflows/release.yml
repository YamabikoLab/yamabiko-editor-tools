name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.5.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify npm version
        run: |
          expected_npm_version="11.5.1"
          actual_npm_version="$(npm --version)"

          if [ "${actual_npm_version}" != "${expected_npm_version}" ]; then
            echo "::error::Expected npm ${expected_npm_version}, but found ${actual_npm_version}."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${TAG_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [ "${TAG_NAME}" = "${tag_version}" ]; then
            echo "::error::Release tag must start with v."
            exit 1
          fi

          if [ "${tag_version}" != "${package_version}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match package version ${package_version}."
            exit 1
          fi

          npm run version:check

      - name: Build release ZIP
        run: npm run plugin-zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            yamabiko-editor-tools.zip \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
