name: Issue 264 lockfile update

on:
  push:
    branches:
      - chore/264-release-workflow

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Fix root package versions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require( 'node:fs' );
          const path = 'package-lock.json';
          const lock = JSON.parse( fs.readFileSync( path, 'utf8' ) );
          lock.version = '0.0.0';
          lock.packages[''].version = '0.0.0';
          fs.writeFileSync( path, `${ JSON.stringify( lock, null, '\t' ) }\n` );
          NODE

      - name: Commit lockfile update
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- package-lock.json; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: fix package lock version metadata'
          git push origin "HEAD:${GITHUB_REF_NAME}"
