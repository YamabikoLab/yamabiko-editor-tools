name: Coverage Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.5.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify npm version
        run: |
          expected_npm_version="11.5.1"
          actual_npm_version="$(npm --version)"
          if [ "${actual_npm_version}" != "${expected_npm_version}" ]; then
            echo "::error::Expected npm ${expected_npm_version}, but found ${actual_npm_version}."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run Jest coverage
        run: npm run test:unit:coverage

      - name: Probe marker
        run: echo "coverage probe"
